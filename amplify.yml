version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install
        - npm run build --workspace=shared
    build:
      commands:
        - npm run build --workspace=apps/web
  artifacts:
    baseDirectory: apps/web/dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - shared/dist/**/*
